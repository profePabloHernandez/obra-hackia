*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan-ink);outline-offset:2px}

/* Vetas */
.veins{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--veins-bg)}
.vein{position:absolute;left:-60%;width:220%;height:1.5px;transform:rotate(var(--r,-32deg));background:linear-gradient(90deg,transparent 0%,var(--c) 45%,transparent 100%);opacity:calc(var(--o,.5) * var(--vm))}
.vein::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px;background:inherit;filter:blur(8px);opacity:.55}
.vein.w{height:3px}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:18px}

/* Encabezado */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:12px;min-width:0}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600;min-width:0}
.theme{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--card-line);background:linear-gradient(180deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hi);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.theme:active{transform:scale(.92)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(46px,15vw,66px);line-height:.95;letter-spacing:-.035em;text-wrap:balance}
h1 .ia{background:linear-gradient(100deg,var(--count-a) 10%,var(--count-b) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1 .sub{display:block;font-weight:500;font-size:.46em;letter-spacing:.02em;color:var(--ink);margin-top:6px}
.tagline{color:var(--ink-2);font-size:15px}
.tagline em{font-style:normal;color:var(--ink);font-weight:600;background:linear-gradient(transparent 62%,var(--em) 62%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);min-width:0}
.chip svg{flex:none;color:var(--cyan-ink)}

/* Tarjeta Ahora */
.now-in{position:relative;border-radius:26px;padding:18px 18px 16px;background:linear-gradient(160deg,var(--now-a),var(--now-b));border:1px solid var(--now-line);box-shadow:inset 0 1px 0 var(--now-hi);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);display:flex;flex-direction:column;gap:10px}
.now-in.live{border-color:var(--live-line);box-shadow:0 18px 50px -22px var(--pink),inset 0 0 0 1px rgba(207,77,225,.14),inset 0 1px 0 var(--now-hi)}
.kicker{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.live .kicker{color:var(--pink-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(207,77,225,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(207,77,225,0)}100%{box-shadow:0 0 0 0 rgba(207,77,225,0)}}
.now-title{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,6.4vw,26px);line-height:1.18;letter-spacing:-.02em;text-wrap:balance}
.now-meta{color:var(--ink-2);font-size:13.5px}
.now-meta b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--violet));transition:width .6s ease}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.next{display:flex;gap:10px;align-items:baseline;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:600}
.next .lbl{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan-ink);font-weight:700}
.count{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,11vw,46px);letter-spacing:-.03em;line-height:1}
.count span{background:linear-gradient(100deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* Anuncio y avisos para administración */
/* Caja de anuncios: texto, enlaces clicables, botón con enlace e imagen 16:9 */
.ann{display:flex;flex-direction:column;gap:10px}
.ann-h{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);padding:0 2px;font-family:var(--font-body)}
.ann-h svg{flex:none;width:18px;height:18px;color:var(--cyan-ink)}
.ann-card{overflow:hidden;border-radius:22px;background:linear-gradient(160deg,var(--now-a),var(--now-b));border:1px solid var(--now-line);box-shadow:inset 0 1px 0 var(--now-hi);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.ann-img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--track)}
.ann-body{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}
.ann-text{font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-line}
.ann-text a{color:var(--cyan-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1.5px}
.ann-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-weight:600;font-size:13.5px;text-decoration:none;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
.ann-btn svg{flex:none}
.ann-btn:active{transform:scale(.97)}
.annlist{display:flex;flex-direction:column;gap:8px}
.annrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--subtle);border:1px solid var(--line)}
.annrow img,.annrow .ph{display:block;width:56px;height:32px;border-radius:8px;object-fit:cover;background:var(--track)}
.annrow p{margin:0;font-size:13px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.annrow .row2{flex-wrap:nowrap;gap:6px}
.annrow .btn{padding:7px 11px;font-size:12.5px}
.annform{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px dashed var(--line)}
.annform>label,.annform .lb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.prev img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.upl{position:relative}
.file{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
.file:focus-visible+label{outline:2px solid var(--cyan-ink);outline-offset:2px}
.hint{padding:11px 14px;border-radius:16px;background:var(--hint-bg);border:1px dashed var(--hint-line);font-size:13px;color:var(--amber-ink)}

/* Agenda y selector de día en cristal */
.agenda{display:flex;flex-direction:column;gap:14px}
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--veil) 72%,var(--veil0))}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:20px;background:linear-gradient(180deg,var(--seg-a),var(--seg-b));border:1px solid var(--seg-line);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.glide{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 12px) / 2);border-radius:16px;transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform .45s cubic-bezier(.32,.72,0,1);
  background:linear-gradient(180deg,var(--glide-a),var(--glide-b) 58%),linear-gradient(135deg,var(--glide-c1),var(--glide-c2));
  border:1px solid var(--glide-line);
  box-shadow:inset 0 1px 0 var(--glide-hi),0 10px 26px -10px var(--glide-shadow);
  -webkit-backdrop-filter:blur(10px) saturate(190%);backdrop-filter:blur(10px) saturate(190%)}
.tab{position:relative;z-index:1;border:0;background:transparent;border-radius:16px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--ink-2);transition:color .3s,transform .2s;-webkit-tap-highlight-color:transparent}
.tab b{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.tab small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tab.on{color:var(--tab-on)}
.tab:active{transform:scale(.95)}

.dayhead{display:flex;flex-direction:column;gap:2px;margin-bottom:-4px}
.dayhead h2{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.dayhead p{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Actividades */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{--op:1;opacity:var(--op);border-radius:20px;background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--card-line);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s,background .2s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px)}to{opacity:var(--op,1);transform:none;filter:none}}
.list.enter .item{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.row{display:grid;grid-template-columns:60px 32px minmax(0,1fr) 24px;gap:10px;align-items:center;width:100%;padding:14px 12px;background:none;border:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:20px;transition:background .2s}
.row:active{background:var(--press)}
.ti{display:grid;place-items:center;width:32px;height:32px}
.ti svg{width:28px;height:28px;display:block;fill:none;stroke:url(#hkg);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Valida un programa y lo deja en forma normal. Devuelve null si algo no cuadra. */
function cleanAgenda(a){
  if(!Array.isArray(a)||a.length!==2){return null;}
  var out=[],d,i;
  for(d=0;d<2;d++){
    if(!Array.isArray(a[d])||!a[d].length){return null;}
    var list=[];
    for(i=0;i<a[d].length;i++){
      var x=a[d][i];
      if(!x||typeof x.id!=='string'||typeof x.name!=='string'||!Array.isArray(x.a)||!Array.isArray(x.b)){return null;}
      var a0=+x.a[0],a1=+x.a[1],b0=+x.b[0],b1=+x.b[1];
      if(!(isFinite(a0)&&isFinite(a1)&&isFinite(b0)&&isFinite(b1))){return null;}
      list.push({id:x.id,a:[a0,a1],b:[b0,b1],kind:(x.kind==='reg'||x.kind==='break')?x.kind:'talk',name:x.name,desc:typeof x.desc==='string'?x.desc:'',who:typeof x.who==='string'?x.who:'',forja:!!x.forja,canceled:!!x.canceled,icon:(typeof x.icon==='string'&&TICONS[x.icon])?x.icon:''});
    }
    list.sort(function(p,q){return (p.a[0]*60+p.a[1])-(q.a[0]*60+q.a[1]);});
    out.push(list);
  }
  return out;
}

/* Solo se aceptan direcciones http y https con un dominio. Si falta el https:// se agrega. */
function safeUrl(u){
  u=String(u==null?'':u).trim();
  if(!u){return '';}
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u)){u='https://'+u.replace(/^\/+/,'');}
  try{
    var x=new URL(u);
    if(x.protocol!=='https:'&&x.protocol!=='http:'){return '';}
    if(!x.hostname||x.hostname.indexOf('.')<0){return '';}
    return x.href;
  }catch(e){return '';}
}
/* Convierte las direcciones web del texto en enlaces clicables. Todo lo demás se escapa. */
function linkify(t){
  var out='',last=0,re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi,m;
  while((m=re.exec(t))){
    var raw=m[0],trail='',tm=/[.,;:!?)\]}»”’]+$/.exec(raw);
    if(tm){trail=tm[0];raw=raw.slice(0,raw.length-trail.length);}
    var href=safeUrl(raw);
    out+=esc(t.slice(last,m.index));
    if(href){
      var shown=raw.replace(/^https?:\/\//i,'').replace(/\/$/,'');
      if(shown.length>40){shown=shown.slice(0,38)+'…';}
      out+='<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(shown)+'</a>'+esc(trail);
    }else{out+=esc(m[0]);}
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}
function cleanNotices(a){
  var out=[],i;
  if(!Array.isArray(a)){return out;}
  for(i=0;i<a.length&&out.length<8;i++){
    var n=a[i];
    if(!n||typeof n!=='object'){continue;}
    var o={
      id:typeof n.id==='string'&&n.id?n.id.slice(0,40):'a'+i,
      text:typeof n.text==='string'?n.text.slice(0,400):'',
      img:(typeof n.img==='string'&&n.img.length<600000&&IMG_RE.test(n.img))?n.img:'',
      url:safeUrl(n.url),
      label:typeof n.label==='string'?n.label.slice(0,40):''
    };
    if(o.text||o.img||o.url){out.push(o);}
  }
  return out;
}
/* La imagen se lleva a un cuadro 16:9 de 1000 x 562 px, del mismo formato que la tarjeta "Próximamente".
   Si la foto no es 16:9, se centra completa sobre un fondo difuminado de ella misma. */
function processImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var iw=im.naturalWidth,ih=im.naturalHeight;
        if(!iw||!ih){throw new Error('size');}
        var W=1000,H=562,c=document.createElement('canvas');
        c.width=W;c.height=H;
        var g=c.getContext('2d');
        g.fillStyle='#021047';g.fillRect(0,0,W,H);
        var t=document.createElement('canvas');t.width=32;t.height=18;
        var tg=t.getContext('2d'),sc=Math.max(32/iw,18/ih);
        tg.drawImage(im,(32-iw*sc)/2,(18-ih*sc)/2,iw*sc,ih*sc);
        g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
        g.drawImage(t,-30,-17,W+60,H+34);
        g.fillStyle='rgba(1,8,43,.28)';g.fillRect(0,0,W,H);
        var k=Math.min(W/iw,H/ih),dw=iw*k,dh=ih*k;
        g.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);
        var out=c.toDataURL('image/jpeg',0.82);
        if(out.length>260000){out=c.toDataURL('image/jpeg',0.66);}
        URL.revokeObjectURL(url);
        res(out);
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('load'));};
    im.src=url;
  });
}

/* ---------- Formato de horas ---------- */
function t12(a){
  var h=a[0],m=a[1];
  if(h===12&&m===0){return {t:'12:00',s:'m.'};}
  return {t:(h%12===0?12:h%12)+':'+pad(m),s:h<12?'a. m.':'p. m.'};
}
function fmt(a){var x=t12(a);return x.t+' '+x.s;}
function hhmm(a){return pad(a[0])+':'+pad(a[1]);}
function parseTime(v){
  var m=/^(\d{1,2}):(\d{2})/.exec(v||'');
  if(!m){return null;}
  var h=+m[1],mi=+m[2];
  if(h>23||mi>59){return null;}
  return [h,mi];
}

function todayIndex(now){
  var d=new Date(now-6*3600000);
  var k=[d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()];
  for(var i=0;i<DAYS.length;i++){var D=DAYS[i].date;if(D[0]===k[0]&&D[1]===k[1]&&D[2]===k[2]){return i;}}
  return -1;
}

/* ---------- Cálculo de estado (automático por hora o manual) ---------- */
function compute(now){
  var live=-1,manual=false,i,first=-1,last=-1;
  for(i=0;i<ALL.length;i++){
    if(!ALL[i].canceled){if(first<0){first=i;}last=i;}
  }
  if(first<0){first=0;last=ALL.length-1;}
  if(cfg.mode==='manual'&&cfg.manualId){
    for(i=0;i<ALL.length;i++){if(ALL[i].id===cfg.manualId&&!ALL[i].canceled){live=i;manual=true;break;}}
  }
  if(!manual){
    for(i=0;i<ALL.length;i++){if(!ALL[i].canceled&&now>=ALL[i].s&&now<ALL[i].e){live=i;break;}}
  }
  var st=[],phase,next=-1;
  if(live>=0){
    phase='live';
    for(i=0;i<ALL.length;i++){st.push(i<live?'done':(i===live?'live':'todo'));}
    for(i=live+1;i<ALL.length;i++){if(!ALL[i].canceled){next=i;break;}}
  }else if(now<ALL[first].s){
    phase='before';
    for(i=0;i<ALL.length;i++){st.push('todo');}
    next=first;
  }else if(now>=ALL[last].e){
    phase='after';
    for(i=0;i<ALL.length;i++){st.push('done');}
  }else{
    phase='between';
    for(i=0;i<ALL.length;i++){st.push(ALL[i].e<=now?'done':'todo');}
    for(i=0;i<ALL.length;i++){if(!ALL[i].canceled&&ALL[i].s>now){next=i;break;}}
    if(next<0){phase='after';}
  }
  for(i=0;i<ALL.length;i++){if(ALL[i].canceled){st[i]='canceled';}}
  return {phase:phase,live:live,next:next,st:st,manual:manual,first:first};
}

/* ---------- Tarjeta Ahora ---------- */
function renderNow(now){
  var h='',pct=null,it,nx;
  if(S.phase==='live'){
    it=ALL[S.live];nx=S.next>=0?ALL[S.next]:null;
    var who=it.kind==='talk'?whyShort(it.who):'';
    h+='<div class="now-in live"><div class="kicker"><span class="dot"></span>En curso</div>';
    h+='<h2 class="now-title">'+esc(it.name)+'</h2>';
    h+='<p class="now-meta"><b>'+fmt(it.a)+' – '+fmt(it.b)+'</b>'+(who?' · '+esc(who):'')+'</p>';
    if(!S.manual){
      pct=Math.max(0,Math.min(100,(now-it.s)/(it.e-it.s)*100));
      var left=Math.max(1,Math.ceil((it.e-now)/60000));
      h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i></i></div>';
      h+='<div class="bar-l"><span>Inició '+fmt(it.a)+'</span><span>'+(left>=60?Math.floor(left/60)+' h '+(left%60?pad(left%60)+' min':''):left+' min')+' para terminar</span></div>';
    }
    if(nx){
      h+='<div class="next"><span class="lbl">Sigue</span><span><b>'+esc(nx.name)+'</b> · '+(nx.day!==it.day?DAYS[nx.day].label+', ':'')+fmt(nx.a)+'</span></div>';
    }
    h+='</div>';
  }else if(S.phase==='before'){
    nx=ALL[S.next];
    var diff=nx.s-now,days=Math.floor(diff/86400000),hrs=Math.floor((diff%86400000)/3600000),mins=Math.floor((diff%3600000)/60000);
    var big;
    if(days>=2){big='Faltan <span>'+days+' días</span>';}
    else if(days===1){big='Falta <span>1 día</span>';}
    else{big='Faltan <span>'+hrs+' h '+pad(mins)+' min</span>';}
    h+='<div class="now-in"><div class="kicker">Próximamente</div><p class="count">'+big+'</p>';
    h+='<p class="now-meta"><b>'+DAYS[nx.day].long+'</b> · desde las '+fmt(nx.a)+'</p>';
    h+='<div class="next"><span class="lbl">Abre</span><span><b>'+esc(nx.name)+'</b> · Auditorio Danilo Jiménez</span></div>';
    if(locked()){h+='<p class="now-meta">La agenda completa se mostrará cuando abra la inscripción.</p>';}
    h+='</div>';
  }else if(S.phase==='between'){
    nx=ALL[S.next];
    h+='<div class="now-in"><div class="kicker">Entre actividades</div>';
    h+='<h2 class="now-title">'+esc(nx.name)+'</h2>';
    h+='<p class="now-meta"><b>'+DAYS[nx.day].long+' · '+fmt(nx.a)+'</b></p></div>';
  }else{
    h+='<div class="now-in"><div class="kicker">Evento finalizado</div>';
    h+='<h2 class="now-title">Gracias por ser parte de HackIA formación</h2>';
    h+='<p class="now-meta">El compromiso continúa en el Aula Virtual, con la ruta de dos semanas.</p></div>';
  }
  els.now.innerHTML=h;
  if(pct!==null){var bar=els.now.querySelector('.bar i');if(bar){bar.style.width=pct+'%';}}
}

/* ---------- Selector de día (cristal), encabezado y lista ---------- */
function renderTabs(now){
  var td=todayIndex(now),tabs=els.days.querySelectorAll('.tab'),i;
  els.days.style.setProperty('--i',String(curDay));
  for(i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('on',i===curDay);
    tabs[i].setAttribute('aria-selected',i===curDay?'true':'false');
    $('sm'+i).textContent=DAYS[i].short+(i===td?' · Hoy':'');
  }
}
function dayItems(d){return ALL.filter(function(x){return x.day===d;});}
function renderDayHead(){
  var items=dayItems(curDay);
  var act=items.filter(function(x){return !x.canceled;});
  if(!act.length){act=items;}
  els.dayhead.innerHTML='<h2>'+DAYS[curDay].long+'</h2><p>'+act.length+' actividades · '+fmt(act[0].a)+' – '+fmt(act[act.length-1].b)+'</p>';
}
function isExpanded(it,st){
  if(openSet[it.id]){return true;}
  if(closedSet[it.id]){return false;}
  return st==='live';
}
function whoGroups(w){
  var g=[];
  String(w||'').split(/\s*;\s*/).join('\n').split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l){return;}
    var b=/^[•·\-–]\s*/.test(l);l=l.replace(/^[•·\-–]\s*/,'');
    if(b||!g.length){g.push([l]);}else{g[g.length-1].push(l);}
  });
  return g;
}
/* Resumen corto para la tarjeta Ahora. */
function whyShort(w){var g=whoGroups(w);return g.length?g[0][0]+(g.length>1?' y '+(g.length-1)+(g.length===2?' persona más':' personas más'):''):'';}
function moreHtml(it){
  var h='<div class="more"><p class="desc">'+esc(it.desc)+'</p>';
  if(it.kind==='talk'){
    h+='<div class="who"><span class="lbl">A cargo</span>'+(it.who?whoGroups(it.who).map(function(g){return '<span class="val">'+g.map(esc).join('<br>')+'</span>';}).join(''):'<span class="tbd">Por confirmar</span>')+'</div>';
  }
  if(it.forja){
    h+='<div class="forja"><p>Se trabaja con el Método FORJA, cinco piezas para formular un prompt:</p><div class="fp">'+FORJA.map(function(f){return '<span><b style="--c:'+f[2]+';color:'+f[3]+'">'+f[0]+'</b>'+f[1]+'</span>';}).join('')+'</div></div>';
  }
  if(isAdmin){
    var id=it.id,marked=cfg.mode==='manual'&&cfg.manualId===id;
    h+='<div class="adm">';
    h+='<label for="f-name-'+id+'">Nombre</label><input type="text" id="f-name-'+id+'" maxlength="120" value="'+esc(it.name)+'">';
    h+='<label for="f-desc-'+id+'">Descripción</label><textarea id="f-desc-'+id+'" maxlength="400">'+esc(it.desc)+'</textarea>';
    if(it.kind==='talk'){
      h+='<label for="f-who-'+id+'">A cargo (inicie cada persona con •; puede usar varias líneas)</label><textarea id="f-who-'+id+'" maxlength="480" rows="6" placeholder="Una persona o instancia por línea">'+esc(it.who)+'</textarea>';
    }
    h+='<label for="f-icon-'+id+'">Icono</label><select id="f-icon-'+id+'">'+Object.keys(TICONS).map(function(k){return '<option value="'+k+'"'+(iconKey(it)===k?' selected':'')+'>'+TICONS[k][0]+'</option>';}).join('')+'</select>';
    h+='<div class="adm-times"><div><label for="f-a-'+id+'">Inicia</label><input type="time" id="f-a-'+id+'" value="'+hhmm(it.a)+'"></div><div><label for="f-b-'+id+'">Termina</label><input type="time" id="f-b-'+id+'" value="'+hhmm(it.b)+'"></div></div>';
    h+='<div class="row2"><button type="button" class="btn primary" data-act="savedit" data-id="'+id+'">Guardar cambios</button>';
    if(!it.canceled){
      h+=marked?'<button type="button" class="btn" data-act="unmark" data-id="'+id+'">Desmarcar</button>':'<button type="button" class="btn" data-act="mark" data-id="'+id+'">Marcar como actual</button>';
      h+='<button type="button" class="btn warn" data-act="cancel" data-id="'+id+'">Cancelar actividad</button>';
    }else{
      h+='<button type="button" class="btn warn" data-act="restore" data-id="'+id+'">Reactivar actividad</button>';
    }
    h+='<button type="button" class="btn danger" data-act="delete" data-id="'+id+'">'+(armed===id?'Confirmar eliminación':'Eliminar')+'</button>';
    h+='</div></div>';
  }
  return h+'</div>';
}
function renderList(){
  var items=dayItems(curDay);
  els.list.classList.toggle('enter',animateNext);
  animateNext=false;
  els.list.innerHTML=items.map(function(it,n){
    var st=S.st[it.g],open=isExpanded(it,st),tt=t12(it.a);
    return '<li class="item '+st+(it.kind==='break'?' break':'')+(open?' open':'')+'" style="--i:'+n+'">'
      +'<button type="button" class="row" data-act="toggle" data-id="'+esc(it.id)+'" aria-expanded="'+open+'">'
      +'<span class="t"><b>'+tt.t+'</b><i>'+tt.s+'</i></span>'+tIcon(it)
      +'<span class="main"><span class="name">'+esc(it.name)+'</span><span class="meta">'+(st==='live'?'<span class="pill">En curso</span>':'')+(st==='canceled'?'<span class="pill cx">Cancelada</span>':'')+'<span>'+it.dur+' min · hasta '+fmt(it.b)+'</span></span></span>'
      +'<span class="ico">'+(st==='done'&&!open?ICON.check:ICON.chev)+'</span></button>'
      +(open?moreHtml(it):'')+'</li>';
  }).join('');
  els.addwrap.innerHTML=isAdmin?'<button type="button" class="btn" data-act="add">Agregar actividad al '+DAYS[curDay].short.toLowerCase()+'</button>':'';
}
function renderNotice(){
  var L=cfg.notices;
  if(!L.length){els.notice.innerHTML='';return;}
  var h='<section class="ann" aria-label="Anuncios"><h2 class="ann-h">'+ICON.mega+'Anuncios</h2>';
  L.forEach(function(n){
    h+='<article class="ann-card">';
    if(n.img){h+='<img class="ann-img" src="'+n.img+'" alt="Imagen del anuncio" decoding="async">';}
    var link=n.url?'<a class="ann-btn" href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.label||'Abrir enlace')+OUTICON+'</a>':'';
    if(n.text||link){h+='<div class="ann-body">'+(n.text?'<p class="ann-text">'+linkify(n.text)+'</p>':'')+link+'</div>';}
    h+='</article>';
  });
  els.notice.innerHTML=h+'</section>';
}

/* ---------- Administración de anuncios ---------- */
function findNotice(id){
  for(var i=0;i<cfg.notices.length;i++){if(cfg.notices[i].id===id){return cfg.notices[i];}}
  return null;
}
function renderAnnList(){
  var box=$('ann-list');
  if(!cfg.notices.length){box.innerHTML='<p class="help">Todavía no hay anuncios publicados.</p>';return;}
  box.innerHTML=cfg.notices.map(function(n){
    var ex=n.text||n.url||'Solo imagen';
    return '<div class="annrow">'+(n.img?'<img src="'+n.img+'" alt="">':'<span class="ph"></span>')
      +'<p>'+esc(ex)+'</p><span class="row2"><button type="button" class="btn" data-act="ann-edit" data-id="'+esc(n.id)+'">Editar</button>'
      +'<button type="button" class="btn danger" data-act="ann-del" data-id="'+esc(n.id)+'">'+(annArmed===n.id?'¿Quitar?':'Quitar')+'</button></span></div>';
  }).join('');
}
function setPrev(src){
  $('ann-prev').hidden=!src;
  if(src){$('ann-img').src=src;}else{$('ann-img').removeAttribute('src');}
  $('ann-imgclear').hidden=!src;
  $('ann-filebtn').textContent=src?'Cambiar imagen':'Elegir imagen';
}
function fillForm(){
  var n=draft.id?findNotice(draft.id):null;
  if(draft.id&&!n){draft={id:null,img:''};}
  $('ann-text').value=n?n.text:'';
  $('ann-link').value=n?n.url:'';
  $('ann-linklbl').value=n?n.label:'';
  $('ann-file').value='';
  setPrev(draft.img);
  $('ann-formlbl').textContent=n?'Editar anuncio':'Nuevo anuncio';
  $('ann-save').textContent=n?'Guardar cambios':'Publicar anuncio';
  $('ann-cancel').hidden=!n;
}
function renderHint(now){
  var show=isAdmin&&cfg.reveal!=='open'&&S.phase==='before';
  if(!show){els.hint.innerHTML='';return;}
  var nx=ALL[S.next];
  els.hint.innerHTML='<p class="hint">Solo la administración ve la agenda por ahora. Las personas asistentes la verán desde las '+fmt(nx.a)+' del '+DAYS[nx.day].long.toLowerCase()+'.</p>';
}

function refresh(force){
  var now=Date.now();
  S=compute(now);
  var lk=locked();
  renderNow(now);
  renderHint(now);
  els.agenda.hidden=lk;
  var wr=$('wrap');if(wr){wr.classList.toggle('solo',lk);}
  var sig=S.st.join('')+'|'+curDay+'|'+isAdmin+'|'+lk+'|'+armed;
  if(force||sig!==lastSig){
    var ae=document.activeElement;
    var typing=isAdmin&&!force&&ae&&els.list.contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName);
    if(!typing){
      lastSig=sig;
      renderTabs(now);renderDayHead();renderList();
    }
  }
}

/* ---------- Avisos breves ---------- */
function toast(msg,sticky){
  var el=els.toast;el.textContent=msg;el.hidden=false;
  clearTimeout(toastTimer);
  if(!sticky){toastTimer=setTimeout(function(){el.hidden=true;},4200);}
}

/* ---------- Panel de administración ---------- */
function openSheet(){
  $('scrim').hidden=false;$('sheet').hidden=false;
  syncSheet();
  $('sheet').scrollTop=0;
}
function closeSheet(){$('scrim').hidden=true;$('sheet').hidden=true;}
function syncSheet(){
  var man=cfg.mode==='manual'&&!!cfg.manualId;
  $('m-auto').setAttribute('aria-pressed',man?'false':'true');
  $('m-man').setAttribute('aria-pressed',man?'true':'false');
  var name='';
  if(man){ALL.forEach(function(x){if(x.id===cfg.manualId){name=x.name;}});}
  $('mode-help').textContent=man
    ?'Manual: la actividad en curso es "'+name+'". Abra otra actividad y use "Marcar como actual" para avanzar, o "Desmarcar" para volver al modo automático.'
    :'Automático: la agenda avanza sola según la hora de Costa Rica.';
  var ro=cfg.reveal==='open';
  $('r-time').setAttribute('aria-pressed',ro?'false':'true');
  $('r-open').setAttribute('aria-pressed',ro?'true':'false');
  $('reveal-help').textContent=ro
    ?'Las personas asistentes ya pueden ver la agenda completa.'
    :'La agenda completa se muestra cuando abre la inscripción del jueves 26. Antes solo se ve la cuenta regresiva. Esto oculta la agenda en pantalla, no la protege de quien lea el código de la página.';
  renderAnnList();fillForm();
}

function cloneCfg(){
  return {mode:cfg.mode,manualId:cfg.manualId,notices:clone(cfg.notices),reveal:cfg.reveal,agenda:clone(AGENDA)};
}
function findItem(agenda,id){
  for(var d=0;d<agenda.length;d++){for(var i=0;i<agenda[d].length;i++){if(agenda[d][i].id===id){return {day:d,i:i,it:agenda[d][i]};}}}
  return null;
}

/* Arma la página completa a partir del estado, con la misma estructura con la que se publicó. */
function buildDoc(next){
  var reset='',styles=document.head.querySelectorAll('style'),i;
  for(i=0;i<styles.length;i++){if(styles[i].textContent.indexOf('safe-area-inset')>-1){reset=styles[i].textContent;break;}}
  if(!reset&&styles.length){reset=styles[0].textContent;}
  var json=JSON.stringify(next).replace(/</g,'\\u003c');
  var css=$('page-css').textContent;
  var js=$('page-js').textContent;
  var tpl=$('shell-src').innerHTML;
  var CLOSE='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +HEAD_BLOCK
    +'<style id="page-css">'+css+'</style>\n<div id="app"></div>\n<template id="shell-src">'+tpl+'</template>\n'
    +'<script type="application/json" id="cfg">'+json+CLOSE+'\n'
    +'<script id="page-js">'+js+CLOSE
    +'</body></html>';
}

function publishCfg(next,okMsg,keepOpenId){
  if(!artifact||busy){return;}
  busy=true;
  toast('Publicando cambios…',true);
  try{
    sessionStorage.setItem('hk-day',String(curDay));
    if($('sheet').hidden){sessionStorage.removeItem('hk-sheet');}else{sessionStorage.setItem('hk-sheet','1');}
    if(keepOpenId){sessionStorage.setItem('hk-open',keepOpenId);}else{sessionStorage.removeItem('hk-open');}
  }catch(e){}
  artifact.publish(buildDoc(next)).then(function(){
    toast(okMsg||'Listo. Los cambios llegan a las pantallas en unos segundos.');
  }).catch(function(e){
    busy=false;
    var c=e&&e.code;
    if(c==='conflict'){toast('La agenda se actualizó antes de guardar. Revise y repita el cambio.');}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){
      isAdmin=false;$('adminbtn').hidden=true;closeSheet();refresh(true);
      toast('Esta cuenta solo puede ver la agenda.');
    }
    else if(c==='rate_limited'){toast('Hay muchos cambios seguidos. Espere un momento.');}
    else if(c==='too_large'){toast('La agenda quedó demasiado grande para publicarse.');}
    else{toast('No se pudo publicar. Intente de nuevo.');}
  });
}

/* ---------- Acciones ---------- */
function onAction(act,btn){
  var id=btn.getAttribute('data-id'),n,f;
  if(act==='toggle'){
    var it=null;ALL.forEach(function(x){if(x.id===id){it=x;}});
    if(!it){return;}
    var was=isExpanded(it,S.st[it.g]);
    if(was){delete openSet[id];closedSet[id]=true;}else{openSet[id]=true;delete closedSet[id];}
    armed=null;
    renderList();
    return;
  }
  if(act==='theme'){toggleTheme();return;}
  if(act==='day'){
    n=parseInt(btn.getAttribute('data-day'),10);
    if((n===0||n===1)&&n!==curDay){
      curDay=n;animateNext=true;
      try{location.hash='dia-'+(n+1);}catch(e){}
      refresh(true);
    }
    return;
  }
  if(!isAdmin){return;}

  if(act!=='delete'&&armed){armed=null;}
  if(act==='sheet-open'){openSheet();}
  else if(act==='sheet-close'){closeSheet();}
  else if(act==='mode-auto'){
    n=cloneCfg();n.mode='auto';n.manualId=null;publishCfg(n,'Modo automático activado.');
  }else if(act==='mode-manual'){
    n=cloneCfg();n.mode='manual';
    if(!n.manualId){n.manualId=S.live>=0?ALL[S.live].id:ALL[S.first].id;}
    publishCfg(n,'Modo manual activado.');
  }else if(act==='reveal-time'||act==='reveal-open'){
    n=cloneCfg();n.reveal=act==='reveal-open'?'open':'time';
    publishCfg(n,n.reveal==='open'?'La agenda ya es visible para todas las personas.':'La agenda se mostrará al abrir la inscripción.');
  }else if(act==='mark'){
    n=cloneCfg();n.mode='manual';n.manualId=id;publishCfg(n,'Actividad marcada como actual.',id);
  }else if(act==='unmark'){
    n=cloneCfg();n.mode='auto';n.manualId=null;publishCfg(n,'Actividad desmarcada. La agenda vuelve al modo automático.',id);
  }else if(act==='cancel'||act==='restore'){
    n=cloneCfg();f=findItem(n.agenda,id);if(!f){return;}
    f.it.canceled=act==='cancel';
    if(act==='cancel'&&n.manualId===id){n.mode='auto';n.manualId=null;}
    publishCfg(n,act==='cancel'?'Actividad cancelada.':'Actividad reactivada.',id);
  }else if(act==='delete'){
    if(armed!==id){armed=id;lastSig='';refresh(true);return;}
    n=cloneCfg();f=findItem(n.agenda,id);if(!f){return;}
    if(n.agenda[f.day].length<2){armed=null;refresh(true);toast('Cada día necesita al menos una actividad.');return;}
    n.agenda[f.day].splice(f.i,1);
    if(n.manualId===id){n.mode='auto';n.manualId=null;}
    armed=null;
    publishCfg(n,'Actividad eliminada.');
  }else if(act==='savedit'){
    n=cloneCfg();f=findItem(n.agenda,id);if(!f){return;}
    var nm=($('f-name-'+id).value||'').replace(/\s+/g,' ').trim();
    var ds=($('f-desc-'+id).value||'').replace(/\s+/g,' ').trim();
    var wh=$('f-who-'+id)?($('f-who-'+id).value||'').split(/\r?\n/).map(function(x){return x.replace(/\s+/g,' ').trim();}).filter(Boolean).join('\n'):f.it.who;
    var ta=parseTime($('f-a-'+id).value),tb=parseTime($('f-b-'+id).value);
    if(!nm){toast('Escriba un nombre para la actividad.');return;}
    if(!ta||!tb){toast('Revise la hora de inicio y de fin.');return;}
    if(tb[0]*60+tb[1]<=ta[0]*60+ta[1]){toast('La hora de fin debe ser posterior a la de inicio.');return;}
    f.it.name=nm.slice(0,120);f.it.desc=ds.slice(0,400);f.it.who=wh.slice(0,480);f.it.a=ta;f.it.b=tb;
    var ic=$('f-icon-'+id)?$('f-icon-'+id).value:'';f.it.icon=TICONS[ic]?ic:'';
    publishCfg(n,'Cambios guardados.',id);
  }else if(act==='add'){
    n=cloneCfg();
    var list=n.agenda[curDay],lastEnd=8*60,k;
    for(k=0;k<list.length;k++){lastEnd=Math.max(lastEnd,list[k].b[0]*60+list[k].b[1]);}
    var s0=Math.min(lastEnd,23*60),e0=Math.min(s0+30,23*60+59);
    var nid='n'+Date.now().toString(36);
    list.push({id:nid,a:[Math.floor(s0/60),s0%60],b:[Math.floor(e0/60),e0%60],kind:'talk',name:'Nueva actividad',desc:'Descripción pendiente.',who:'',forja:false,canceled:false,icon:'bulb'});
    publishCfg(n,'Actividad agregada. Ábrala para editarla.',nid);
  }else if(act==='ann-edit'){
    var cur=findNotice(id);if(!cur){return;}
    draft={id:id,img:cur.img};annArmed=null;
    renderAnnList();fillForm();
    $('ann-form').scrollIntoView({block:'nearest',behavior:'smooth'});
  }else if(act==='ann-cancel'){
    draft={id:null,img:''};renderAnnList();fillForm();
  }else if(act==='ann-img-clear'){
    draft.img='';$('ann-file').value='';setPrev('');
  }else if(act==='ann-del'){
    if(annArmed!==id){annArmed=id;renderAnnList();return;}
    n=cloneCfg();n.notices=n.notices.filter(function(x){return x.id!==id;});
    annArmed=null;
    publishCfg(n,'Anuncio quitado.');
  }else if(act==='ann-save'){
    var text=($('ann-text').value||'').replace(/\r/g,'').split('\n').map(function(l){return l.replace(/\s+/g,' ').trim();}).join('\n').replace(/\n{3,}/g,'\n\n').trim().slice(0,400);
    var urlRaw=($('ann-link').value||'').trim(),url=safeUrl(urlRaw);
    if(urlRaw&&!url){toast('Revise el enlace del botón. Debe ser una dirección web completa, como https://ejemplo.com.');return;}
    var label=($('ann-linklbl').value||'').replace(/\s+/g,' ').trim().slice(0,40);
    if(!text&&!draft.img&&!url){toast('Escriba un texto, agregue una imagen o un enlace.');return;}
    n=cloneCfg();
    if(draft.id){
      var tgt=null;n.notices.forEach(function(x){if(x.id===draft.id){tgt=x;}});
      if(!tgt){toast('No se encontró ese anuncio.');return;}
      tgt.text=text;tgt.img=draft.img;tgt.url=url;tgt.label=label;
    }else{
      if(n.notices.length>=8){toast('Ya hay 8 anuncios. Quite uno para agregar otro.');return;}
      n.notices.unshift({id:'a'+Date.now().toString(36),text:text,img:draft.img,url:url,label:label});
    }
    publishCfg(n,draft.id?'Anuncio actualizado.':'Anuncio publicado.');
  }
}

/* ---------- Arranque ---------- */
function boot(){
  $('app').appendChild($('shell-src').content.cloneNode(true));
  els={now:$('now'),days:$('days'),dayhead:$('dayhead'),list:$('list'),notice:$('notice'),hint:$('hint'),agenda:$('agenda'),addwrap:$('addwrap'),toast:$('toast')};

  /* Día inicial: enlace con #dia-1 / #dia-2, día guardado tras publicar, o el día en curso. */
  var now=Date.now();
  S=compute(now);
  var start=0;
  if(S.live>=0){start=ALL[S.live].day;}
  else if(S.next>=0){start=ALL[S.next].day;}
  else if(S.phase==='after'){start=1;}
  var h=(location.hash||'').replace('#','');
  if(h==='dia-1'){start=0;}
  else if(h==='dia-2'){start=1;}
  else{
    try{
      var sv=sessionStorage.getItem('hk-day');
      if(sv==='0'||sv==='1'){start=parseInt(sv,10);}
    }catch(e){}
  }
  curDay=start;
  try{
    var ko=sessionStorage.getItem('hk-open');
    if(ko){openSet[ko]=true;sessionStorage.removeItem('hk-open');}
  }catch(e){}

  renderNotice();
  refresh(true);
  paintTheme();

  document.addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('[data-act]'):null;
    if(b){onAction(b.getAttribute('data-act'),b);}
  });
  document.addEventListener('change',function(ev){
    var el=ev.target;
    if(!el||el.id!=='ann-file'||!isAdmin){return;}
    var f=el.files&&el.files[0];
    if(!f){return;}
    if(!/^image\//.test(f.type)){toast('Elija un archivo de imagen.');el.value='';return;}
    toast('Preparando la imagen…',true);
    processImage(f).then(function(d){draft.img=d;setPrev(d);toast('Imagen lista. Publique el anuncio para mostrarla.');})
      .catch(function(){el.value='';toast('No se pudo leer esa imagen. Pruebe con otra.');});
  });
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){closeSheet();}});
  window.addEventListener('hashchange',function(){
    var x=(location.hash||'').replace('#','');
    if((x==='dia-1'||x==='dia-2')&&curDay!==(x==='dia-1'?0:1)){curDay=x==='dia-1'?0:1;animateNext=true;refresh(true);}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden){refresh();}});
  setInterval(function(){refresh();},15000);

  /* Administración: solo aparece para quien puede publicar esta página. */
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(a){
      if(!a){return null;}
      artifact=a;
      return window.claude.use('user').then(function(u){
        if(!u){return null;}
        return u.canEdit().then(function(ok){
          if(!ok){return;}
          isAdmin=true;
          $('adminbtn').hidden=false;
          refresh(true);
          try{if(sessionStorage.getItem('hk-sheet')==='1'){openSheet();}}catch(e){}
        });
      });
    }).catch(function(){});
  }
}
boot();
})();
</script></body></html>
